name: "Hatch CI (mirror)"

# Temporary: compiles the mirror of tashda/hatch in .hatch-ci-mirror/hatch (see tools/mirror-to-echo.sh in that repository).
on:
  push:
    branches: [ "claude/echo-labs-features-wmwnbv" ]
    paths: [ ".hatch-ci-mirror/**", ".github/workflows/hatch-ci-mirror.yml" ]
  workflow_dispatch:

concurrency:
  group: hatch-ci-mirror
  cancel-in-progress: true

jobs:
  tests:
    name: "Core tests (macOS)"
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@v4
    - name: Core tests and CLI smoke test
      working-directory: .hatch-ci-mirror/hatch
      run: |
        git config --global user.email ci@hatch.local && git config --global user.name ci
        set -o pipefail
        swift test 2>&1 | tee /tmp/test.log | grep -E "error:|: failed|Executed [0-9]+ tests" | tail -30
        swift build --product hatch && tools/smoke.sh .build/debug/hatch
    - name: Last test lines (shows where a hang is)
      if: always()
      run: tail -40 /tmp/test.log || true

  app:
    name: "App (macOS)"
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Versions
      run: swift --version
    - name: Build the app
      working-directory: .hatch-ci-mirror/hatch/App
      run: |
        set -o pipefail
        swift build 2>&1 | tee /tmp/app-build.log | grep -E "error:|Build complete" | sort -u | head -150
    - name: Screenshots of every screen (made-up data)
      working-directory: .hatch-ci-mirror/hatch/App
      continue-on-error: true
      run: |
        mkdir -p /tmp/shots
        .build/debug/HatchApp --snapshots /tmp/shots &
        pid=$!
        for i in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
        kill $pid 2>/dev/null || true
        ls -la /tmp/shots
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: hatch-screens
        path: /tmp/shots/*.png
        if-no-files-found: warn
    - name: Publish the pictures on a scratch branch (so they can be fetched with git)
      if: always()
      continue-on-error: true
      run: |
        cd /tmp/shots && ls *.png >/dev/null 2>&1 || exit 0
        git init -q && git checkout -q -b hatch-screens
        git config user.email ci@hatch.local && git config user.name ci
        git add -A && git commit -qm "screens for ${GITHUB_SHA}"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hatch-screens

  stage:
    name: "Stage and spike timing (macOS)"
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4
    - name: Stage tests
      working-directory: .hatch-ci-mirror/hatch/Stage
      run: |
        set -o pipefail
        swift test 2>&1 | grep -E "error:|: failed|Executed [0-9]+ tests" | tail -10
    - name: Build StageKit and the toast round
      working-directory: .hatch-ci-mirror/hatch/Stage
      run: |
        set -o pipefail
        swift build 2>&1 | tee /tmp/stage-build.log | grep -E "error:|Build complete" | sort -u | head -150
    - name: Spike timing (round only, StageKit cached)
      working-directory: .hatch-ci-mirror/hatch/Stage
      run: |
        touch Sources/Rounds/ToastR18/*.swift
        start=$(date +%s); swift build --product HatchStageToast 2>&1 | tail -3; end=$(date +%s)
        echo "SPIKE round-only build seconds: $((end-start))"

  xcode:
    name: "Xcode project (macOS)"
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Generate the project and build the app
      working-directory: .hatch-ci-mirror/hatch
      run: |
        set -o pipefail
        brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
        xcodegen generate
        xcodebuild -project Hatch.xcodeproj -scheme Hatch -destination 'platform=macOS' -configuration Debug \
          -derivedDataPath /tmp/dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/xcodebuild.log | grep -E "error:|warning: .*(icon|Icon|asset)|BUILD (SUCCEEDED|FAILED)" | sort -u | head -60
        ls -la /tmp/dd/Build/Products/Debug/ | head
        plutil -p /tmp/dd/Build/Products/Debug/Hatch.app/Contents/Info.plist | head -30
    - name: Publish the generated project on a scratch branch
      if: success()
      continue-on-error: true
      working-directory: .hatch-ci-mirror/hatch
      run: |
        rm -rf /tmp/xp && mkdir -p /tmp/xp/App && cp -R Hatch.xcodeproj /tmp/xp/ && cp App/Info.plist /tmp/xp/App/ 
        cd /tmp/xp && git init -q && git checkout -q -b hatch-xcodeproj
        git config user.email ci@hatch.local && git config user.name ci
        git add -A && git commit -qm "xcodeproj for ${GITHUB_SHA}"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hatch-xcodeproj
