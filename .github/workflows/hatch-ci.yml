name: "Hatch CI"

# Hatch lives in Hatch/ until it moves to its own repository.
on:
  push:
    branches: [ "claude/echo-labs-features-wmwnbv", "hatch" ]
    paths: [ "Hatch/**", ".github/workflows/hatch-ci.yml" ]
  workflow_dispatch:

concurrency:
  group: hatch-ci-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: "Core (Linux)"
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
    - uses: actions/checkout@v4
    - name: Test
      working-directory: Hatch
      run: |
        apt-get update -qq && apt-get install -y -qq libsqlite3-dev git >/dev/null
        swift test

  app-macos:
    name: "App and Stage (macOS)"
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4
    - name: Swift version
      run: swift --version && xcodebuild -version
    - name: Core tests
      working-directory: Hatch
      run: swift test
    - name: Build the app package
      if: hashFiles('Hatch/App/Package.swift') != ''
      working-directory: Hatch/App
      run: swift build 2>&1 | tee /tmp/hatch-app-build.log
    - name: Build the Stage package
      if: hashFiles('Hatch/Stage/Package.swift') != ''
      working-directory: Hatch/Stage
      run: swift build 2>&1 | tee /tmp/hatch-stage-build.log
