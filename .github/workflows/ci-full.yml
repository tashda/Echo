name: "CI (Full)"

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-full-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Step 1: Build & Test"
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27'

    - name: PostgreSQL tools from echo-libraries
      run: Tools/fetch-postgres-tools.sh

    - name: Clear SPM cache
      run: |
        rm -rf ~/Library/Caches/org.swift.swiftpm/repositories
        rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages

    - name: Access to echo-server-lab
      uses: ./.github/actions/lab-repo-access
      with:
        deploy-key: ${{ secrets.LAB_DEPLOY_KEY }}

    - name: Placeholder secrets for test builds
      run: cp Echo/Configuration/Secrets.xcconfig.example Echo/Configuration/Secrets.xcconfig

    - name: Resolve packages
      run: xcodebuild -resolvePackageDependencies -project Echo.xcodeproj -scheme Echo

    - name: Run Unit Tests
      run: |
        find . -maxdepth 1 -name "TestResults-unit*" -exec rm -rf {} + 2>/dev/null || true
        xcodebuild test -project Echo.xcodeproj \
          -scheme Echo -testPlan UnitTests \
          -destination 'platform=macOS' \
          -resultBundlePath TestResults-unit \
          -disable-concurrent-testing \
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=NO ENABLE_HARDENED_RUNTIME=NO OTHER_CODE_SIGN_FLAGS='--deep'

    - name: Upload Unit Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-unit
        path: TestResults-unit.xcresult


  # ── Database tests on echo-server-lab ───────────────────────────────────────
  # Runs the EchoTests plan, which switches on the lab suites (SERVERLAB_INTEGRATION=1): each one
  # starts fresh servers from its recipe on testlab, reached over Tailscale, and removes them.

  lab-tests:
    name: "Step 2: Database tests on the lab"
    runs-on: xcode-27
    needs: [build-and-test]
    timeout-minutes: 120
    concurrency:
      group: testlab
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27'

    - name: PostgreSQL tools from echo-libraries
      run: Tools/fetch-postgres-tools.sh

    - name: Set up lab tests
      id: lab
      uses: ./.github/actions/lab-tests-setup
      with:
        lab-deploy-key: ${{ secrets.LAB_DEPLOY_KEY }}
        tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        testlab-ssh-key: ${{ secrets.TESTLAB_SSH_KEY }}
        testlab-known-hosts: ${{ secrets.TESTLAB_KNOWN_HOSTS }}

    - name: Run the EchoTests plan against the lab
      env:
        TEST_RUNNER_SERVERLAB_CLI: ${{ steps.lab.outputs.serverlab }}
        TEST_RUNNER_SERVERLAB_PASSWORD: ${{ secrets.SERVERLAB_PASSWORD }}
        TEST_RUNNER_SERVERLAB_OWNER_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        find . -maxdepth 1 -name "TestResults-lab*" -exec rm -rf {} + 2>/dev/null || true
        xcodebuild test -project Echo.xcodeproj \
          -scheme Echo -testPlan EchoTests \
          -destination 'platform=macOS' \
          -resultBundlePath TestResults-lab \
          -disable-concurrent-testing \
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_ALLOWED=NO ENABLE_HARDENED_RUNTIME=NO OTHER_CODE_SIGN_FLAGS='--deep'

    - name: Remove servers this run left behind
      if: always()
      env:
        SERVERLAB_PASSWORD: ${{ secrets.SERVERLAB_PASSWORD }}
      run: |
        "${{ steps.lab.outputs.serverlab }}" down --all --owner-prefix "ci-${{ github.run_id }}-${{ github.run_attempt }}" || true
        "${{ steps.lab.outputs.serverlab }}" reap || true

    # The results upload talks to GitHub, which failed to resolve while the runner was on the tailnet.
    - name: Leave the tailnet
      if: always()
      run: sudo "$(command -v tailscale)" down || true

    - name: Upload Lab Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-lab
        path: TestResults-lab.xcresult

  # ── Production Build & Release ──────────────────────────────────────────────

  release:
    name: "Step 3: Production Build & Release"
    runs-on: xcode-27
    needs: [build-and-test, lab-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27'

    - name: PostgreSQL tools from echo-libraries
      run: Tools/fetch-postgres-tools.sh

    - name: Import signing certificate
      env:
        DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
        DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
      run: |
        # Create a temporary keychain for CI
        KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
        KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

        # Import certificate
        CERT_PATH=$RUNNER_TEMP/certificate.p12
        echo "$DEVELOPER_ID_CERT_BASE64" | base64 --decode > "$CERT_PATH"
        security import "$CERT_PATH" -P "$DEVELOPER_ID_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        rm "$CERT_PATH"

        # Add to search list so codesign finds it
        security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

    - name: Access to echo-server-lab
      uses: ./.github/actions/lab-repo-access
      with:
        deploy-key: ${{ secrets.LAB_DEPLOY_KEY }}

    - name: Resolve packages
      run: xcodebuild -resolvePackageDependencies -project Echo.xcodeproj -scheme Echo

    - name: Determine version
      id: version
      run: |
        MARKETING_VERSION=$(xcodebuild -project Echo.xcodeproj -scheme Echo -showBuildSettings 2>/dev/null \
          | grep 'MARKETING_VERSION' | head -1 | awk '{print $3}')
        LATEST_TAG=$(git tag --list "v${MARKETING_VERSION}.*" --sort=-version:refname | head -1)
        LATEST_PATCH=$(printf "%s" "$LATEST_TAG" | sed "s/v${MARKETING_VERSION}\.\([0-9]*\)/\1/")
        PATCH=${LATEST_PATCH:+$((LATEST_PATCH + 1))}
        PATCH=${PATCH:-0}
        BUILD_NUMBER=$(git rev-list --count HEAD | tr -d '[:space:]')
        FULL_VERSION="${MARKETING_VERSION}.${PATCH}"
        echo "full=$FULL_VERSION" >> $GITHUB_OUTPUT
        echo "build=$BUILD_NUMBER" >> $GITHUB_OUTPUT
        echo "previous_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
        echo "patch=$PATCH" >> $GITHUB_OUTPUT
        echo "tag=v$FULL_VERSION" >> $GITHUB_OUTPUT

    - name: Install App Store Connect API key
      run: |
        mkdir -p ~/private_keys
        echo "${{ secrets.ASC_KEY_CONTENT }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

    - name: Build Release (signed)
      run: |
        xcodebuild -project Echo.xcodeproj -scheme Echo -configuration Release -derivedDataPath build \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
          -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
          -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
          MARKETING_VERSION=${{ steps.version.outputs.full }} \
          CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
          CODE_SIGN_STYLE=Manual \
          "CODE_SIGN_IDENTITY=Developer ID Application" \
          DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
          PROVISIONING_PROFILE_SPECIFIER="" \
          ENABLE_HARDENED_RUNTIME=YES \
          OTHER_CODE_SIGN_FLAGS='--options runtime --timestamp'

    - name: Install DMG tooling
      run: brew install create-dmg

    - name: Sign bundled tools and libraries
      run: |
        APP="build/Build/Products/Release/Echo.app"
        SIGN=(codesign --force --sign "Developer ID Application" --timestamp --options runtime)
        # The echo-libraries frameworks first (the tools load them), then the PostgreSQL tools.
        for framework in "$APP"/Contents/Frameworks/Echo*.framework; do
          "${SIGN[@]}" "$framework"
        done
        for tool in "$APP"/Contents/SharedSupport/PostgresTools/*; do
          "${SIGN[@]}" "$tool"
        done
        # Re-sign the app bundle (picks up nested changes)
        codesign --force --deep --sign "Developer ID Application" --timestamp --options runtime "$APP"
        # Verify
        codesign --verify --deep --strict "$APP"

    - name: Package DMG
      run: |
        mkdir -p release dmg-staging
        cp -R build/Build/Products/Release/Echo.app dmg-staging/
        create-dmg \
          --volname "Echo" \
          --window-size 720 420 \
          --icon-size 128 \
          --text-size 16 \
          --icon "Echo.app" 180 190 \
          --hide-extension "Echo.app" \
          --app-drop-link 540 190 \
          --format UDZO \
          release/Echo.dmg \
          dmg-staging
        codesign --force --sign "Developer ID Application" --timestamp release/Echo.dmg

    - name: Notarize
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        # Submit for notarization
        xcrun notarytool submit release/Echo.dmg \
          --apple-id "$APPLE_ID" \
          --password "$APPLE_ID_PASSWORD" \
          --team-id "$APPLE_TEAM_ID" \
          --wait --timeout 600 2>&1 | tee notarize-output.txt

        # If notarization failed, fetch the log
        SUBMISSION_ID=$(grep 'id:' notarize-output.txt | head -1 | awk '{print $2}')
        if grep -q 'Invalid' notarize-output.txt; then
          echo "::group::Notarization Log"
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          echo "::endgroup::"
          exit 1
        fi

        # Staple the notarization ticket
        xcrun stapler staple release/Echo.dmg

    - name: Create ZIP for Sparkle
      run: |
        cd dmg-staging && ditto -c -k --sequesterRsrc --keepParent Echo.app ../release/Echo.zip

    - name: Sparkle & Appcast
      env:
        SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      run: |
        curl -L https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz -o sparkle.tar.xz
        tar -xf sparkle.tar.xz
        DOWNLOAD_PREFIX="https://github.com/tashda/Echo/releases/download/${{ steps.version.outputs.tag }}/"
        # Move DMG out so generate_appcast only sees the ZIP
        mv release/Echo.dmg .
        if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
          echo "$SPARKLE_PRIVATE_KEY" | ./bin/generate_appcast --ed-key-file - --download-url-prefix "$DOWNLOAD_PREFIX" release/
        else
          ./bin/generate_appcast --download-url-prefix "$DOWNLOAD_PREFIX" release/
        fi
        cp release/appcast.xml .
        # Move DMG back for GitHub release
        mv Echo.dmg release/

    - name: Release Notes
      run: |
        python3 .github/scripts/generate_release_notes.py \
          --repo-key echo --repo-name Echo \
          --new-tag "${{ steps.version.outputs.tag }}" \
          --previous-tag "${{ steps.version.outputs.previous_tag }}" \
          --output release-notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Echo ${{ steps.version.outputs.full }}
        files: |
          release/Echo.dmg
          release/Echo.zip
          appcast.xml
        body_path: release-notes.md

    - name: Cleanup keychain
      if: always()
      run: security delete-keychain $RUNNER_TEMP/build.keychain-db 2>/dev/null || true
