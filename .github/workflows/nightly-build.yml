name: Nightly Build

# A signed, notarized build of the dev branch, published every night as the pre-release "Nightly"
# under Releases. It is one rolling release: each night replaces the previous one (tag `nightly`).
# It is never "Latest", has no Sparkle appcast (stable users are not offered it) and does not touch
# the `v*` tags that CI (Full) uses for versions.
on:
  schedule:
    # 01:00 UTC = 03:00 CEST / 02:00 CET
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if dev has no new commits since the last nightly'
        type: boolean
        default: false

concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  check:
    name: "Anything new on dev?"
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.compare.outputs.build }}
      sha: ${{ steps.compare.outputs.sha }}
    steps:
    - id: compare
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        SHA=$(gh api "repos/${{ github.repository }}/commits/dev" --jq .sha)
        LAST=$(gh api "repos/${{ github.repository }}/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        if [ "$SHA" = "$LAST" ] && [ "${{ inputs.force }}" != "true" ]; then
          echo "dev ($SHA) is already the last nightly; skipping."
          echo "build=false" >> "$GITHUB_OUTPUT"
        else
          echo "build=true" >> "$GITHUB_OUTPUT"
        fi

  nightly:
    name: "Build and publish Nightly"
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.check.outputs.sha }}
        fetch-depth: 0
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27'

    - name: Install PostgreSQL tools
      run: |
        brew list libpq >/dev/null 2>&1 || brew install libpq
        brew list krb5 >/dev/null 2>&1 || brew install krb5
        brew list zstd >/dev/null 2>&1 || brew install zstd
        brew list lz4 >/dev/null 2>&1 || brew install lz4
        brew list gettext >/dev/null 2>&1 || brew install gettext
        LIBPQ_PREFIX="$(brew --prefix libpq)"
        mkdir -p Tools/PostgresTools
        cp "$LIBPQ_PREFIX/bin/pg_dump" Tools/PostgresTools/
        cp "$LIBPQ_PREFIX/bin/pg_restore" Tools/PostgresTools/
        SEARCH_DIRS="$LIBPQ_PREFIX/lib $(brew --prefix krb5)/lib $(brew --prefix zstd)/lib $(brew --prefix lz4)/lib $(brew --prefix gettext)/lib $(brew --prefix openssl@3)/lib /opt/homebrew/lib /usr/local/lib"
        for lib in libpq.5.dylib libzstd.1.dylib liblz4.1.dylib libssl.3.dylib libcrypto.3.dylib libintl.8.dylib libgssapi_krb5.2.2.dylib libkrb5.3.3.dylib libk5crypto.3.1.dylib libkrb5support.1.1.dylib libcom_err.3.0.dylib; do
          for dir in $SEARCH_DIRS; do
            if [ -f "$dir/$lib" ]; then cp "$dir/$lib" Tools/PostgresTools/ && break; fi
          done
        done

    - name: Import signing certificate
      env:
        DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
        DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
      run: |
        KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
        KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        CERT_PATH=$RUNNER_TEMP/certificate.p12
        echo "$DEVELOPER_ID_CERT_BASE64" | base64 --decode > "$CERT_PATH"
        security import "$CERT_PATH" -P "$DEVELOPER_ID_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
        rm "$CERT_PATH"
        security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

    - name: Access to echo-server-lab
      uses: ./.github/actions/lab-repo-access
      with:
        deploy-key: ${{ secrets.LAB_DEPLOY_KEY }}

    - name: Create Secrets.xcconfig
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      run: |
        cp Echo/Configuration/Secrets.xcconfig.example Echo/Configuration/Secrets.xcconfig
        # A repository secret, when set, replaces the example placeholder (the later line wins).
        [ -n "$SUPABASE_URL" ] && echo "SUPABASE_URL = $SUPABASE_URL" >> Echo/Configuration/Secrets.xcconfig
        [ -n "$SUPABASE_ANON_KEY" ] && echo "SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY" >> Echo/Configuration/Secrets.xcconfig
        [ -n "$GOOGLE_CLIENT_ID" ] && echo "GOOGLE_CLIENT_ID = $GOOGLE_CLIENT_ID" >> Echo/Configuration/Secrets.xcconfig
        true

    - name: Resolve packages
      run: xcodebuild -resolvePackageDependencies -project Echo.xcodeproj -scheme Echo

    - name: Determine version
      id: version
      run: |
        MARKETING_VERSION=$(xcodebuild -project Echo.xcodeproj -scheme Echo -showBuildSettings 2>/dev/null \
          | grep 'MARKETING_VERSION' | head -1 | awk '{print $3}')
        BUILD_NUMBER=$(git rev-list --count HEAD | tr -d '[:space:]')
        DATE=$(date -u +%Y-%m-%d)
        SHORT=$(git rev-parse --short HEAD)
        echo "marketing=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
        echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
        echo "date=$DATE" >> "$GITHUB_OUTPUT"
        echo "short=$SHORT" >> "$GITHUB_OUTPUT"

    - name: Install App Store Connect API key
      run: |
        mkdir -p ~/private_keys
        echo "${{ secrets.ASC_KEY_CONTENT }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

    - name: Build Release (signed)
      run: |
        xcodebuild -project Echo.xcodeproj -scheme Echo -configuration Release -derivedDataPath build \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
          -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
          -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
          MARKETING_VERSION=${{ steps.version.outputs.marketing }} \
          CURRENT_PROJECT_VERSION=${{ steps.version.outputs.build }} \
          CODE_SIGN_STYLE=Manual \
          "CODE_SIGN_IDENTITY=Developer ID Application" \
          DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
          PROVISIONING_PROFILE_SPECIFIER="" \
          ENABLE_HARDENED_RUNTIME=YES \
          OTHER_CODE_SIGN_FLAGS='--options runtime --timestamp'

    - name: Install DMG tooling
      run: brew install create-dmg

    - name: Sign bundled tools and libraries
      run: |
        APP="build/Build/Products/Release/Echo.app"
        find "$APP" -name '*.dylib' -exec \
          codesign --force --sign "Developer ID Application" --timestamp --options runtime {} \;
        for tool in pg_dump pg_restore; do
          if [ -f "$APP/Contents/Resources/$tool" ]; then
            codesign --force --sign "Developer ID Application" --timestamp --options runtime "$APP/Contents/Resources/$tool"
          fi
        done
        codesign --force --deep --sign "Developer ID Application" --timestamp --options runtime "$APP"
        codesign --verify --deep --strict "$APP"

    - name: Package DMG
      run: |
        mkdir -p release dmg-staging
        cp -R build/Build/Products/Release/Echo.app dmg-staging/
        create-dmg \
          --volname "Echo Nightly" \
          --window-size 720 420 \
          --icon-size 128 \
          --text-size 16 \
          --icon "Echo.app" 180 190 \
          --hide-extension "Echo.app" \
          --app-drop-link 540 190 \
          --format UDZO \
          release/Echo-Nightly.dmg \
          dmg-staging
        codesign --force --sign "Developer ID Application" --timestamp release/Echo-Nightly.dmg

    - name: Notarize
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        xcrun notarytool submit release/Echo-Nightly.dmg \
          --apple-id "$APPLE_ID" \
          --password "$APPLE_ID_PASSWORD" \
          --team-id "$APPLE_TEAM_ID" \
          --wait --timeout 600 2>&1 | tee notarize-output.txt
        SUBMISSION_ID=$(grep 'id:' notarize-output.txt | head -1 | awk '{print $2}')
        if grep -q 'Invalid' notarize-output.txt; then
          echo "::group::Notarization Log"
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          echo "::endgroup::"
          exit 1
        fi
        xcrun stapler staple release/Echo-Nightly.dmg

    - name: Release notes
      run: |
        {
          echo "Automatic build of the \`dev\` branch. Not a stable release: expect rough edges."
          echo
          echo "- Built: ${{ steps.version.outputs.date }} (UTC)"
          echo "- Commit: [\`${{ steps.version.outputs.short }}\`](https://github.com/${{ github.repository }}/commit/${{ needs.check.outputs.sha }})"
          echo "- Version: ${{ steps.version.outputs.marketing }} (build ${{ steps.version.outputs.build }})"
          echo "- Stable builds do not offer this one as an update; install it by hand."
          PREV=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -n "$PREV" ]; then
            echo
            echo "### Changes since $PREV"
            git log "$PREV"..HEAD --no-merges --pretty='- %s' | head -100
          fi
        } > nightly-notes.md

    - name: Replace the Nightly release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
        gh release create nightly release/Echo-Nightly.dmg \
          --target "${{ needs.check.outputs.sha }}" \
          --title "Echo Nightly (${{ steps.version.outputs.date }})" \
          --notes-file nightly-notes.md \
          --prerelease

    - name: Cleanup keychain
      if: always()
      run: security delete-keychain $RUNNER_TEMP/build.keychain-db 2>/dev/null || true
