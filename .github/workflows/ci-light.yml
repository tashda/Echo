name: "CI (Light)"

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

concurrency:
  group: ci-light-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Build & Test"
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27'

    - name: PostgreSQL tools from echo-libraries
      run: Tools/fetch-postgres-tools.sh

    - name: Clear SPM cache
      run: |
        rm -rf ~/Library/Caches/org.swift.swiftpm/repositories
        rm -rf ~/Library/Developer/Xcode/DerivedData/*/SourcePackages

    - name: Placeholder secrets for test builds
      run: cp Echo/Configuration/Secrets.xcconfig.example Echo/Configuration/Secrets.xcconfig

    - name: Resolve packages
      run: xcodebuild -resolvePackageDependencies -project Echo.xcodeproj -scheme Echo

    - name: Run Unit Tests
      run: .github/scripts/run-test-plan.sh UnitTests TestResults-unit

    - name: Upload Unit Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-unit
        path: |
          TestResults-unit.xcresult
          TestResults-unit.log

