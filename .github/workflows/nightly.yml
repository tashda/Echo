name: Nightly Tests

# The SQL Server suites on every supported version (2017, 2019, 2022, 2025) and on 2017 at
# compatibility levels 100-130, one SQLServerVersions configuration each, against lab servers on
# testlab. Postgres and MySQL versions come back after the driver switch.
on:
  workflow_dispatch:

concurrency:
  group: testlab
  cancel-in-progress: false

jobs:
  sqlserver-versions:
    name: "SQL Server versions on the lab"
    runs-on: xcode-27
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27'

    - name: PostgreSQL tools from echo-libraries
      run: Tools/fetch-postgres-tools.sh

    - name: Set up lab tests
      id: lab
      uses: ./.github/actions/lab-tests-setup
      with:
        lab-deploy-key: ${{ secrets.LAB_DEPLOY_KEY }}
        tailscale-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        tailscale-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        testlab-ssh-key: ${{ secrets.TESTLAB_SSH_KEY }}
        testlab-known-hosts: ${{ secrets.TESTLAB_KNOWN_HOSTS }}
        testlab-address: ${{ vars.TESTLAB_ADDRESS }}

    - name: Run the SQLServerVersions plan against the lab
      env:
        TEST_RUNNER_SERVERLAB_CLI: ${{ steps.lab.outputs.serverlab }}
        TEST_RUNNER_SERVERLAB_PASSWORD: ${{ secrets.SERVERLAB_PASSWORD }}
        TEST_RUNNER_SERVERLAB_OWNER_PREFIX: nightly-${{ github.run_id }}-${{ github.run_attempt }}
      run: .github/scripts/run-test-plan.sh SQLServerVersions TestResults-sqlserver-versions

    - name: Remove servers this run left behind
      if: always()
      env:
        SERVERLAB_PASSWORD: ${{ secrets.SERVERLAB_PASSWORD }}
      run: |
        "${{ steps.lab.outputs.serverlab }}" down --all --owner-prefix "nightly-${{ github.run_id }}-${{ github.run_attempt }}" || true
        "${{ steps.lab.outputs.serverlab }}" reap || true

    # The results go up while the runner is still on the tailnet: leaving it (`tailscale down`) broke
    # the runner's name lookups for minutes, and every upload after it failed. The Tailscale action
    # logs out when the job ends.
    - name: Upload SQL Server Version Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-sqlserver-versions
        path: |
          TestResults-sqlserver-versions.xcresult
          TestResults-sqlserver-versions.log
          diagnostics/
