name: "Access to testlab"
description: >
  Joins the tailnet as tag:ci (testlab advertises its address, repository variable TESTLAB_ADDRESS, as a /32 route), sets up
  `ssh testlab` for the lab's Docker commands, installs the Docker command-line tool, and checks
  that testlab's Docker answers.
inputs:
  tailscale-oauth-client-id:
    required: true
  tailscale-oauth-secret:
    required: true
  ssh-key:
    description: "Private key authorised for lab@testlab (secret TESTLAB_SSH_KEY)"
    required: true
  known-hosts:
    description: "testlab's host key line (secret TESTLAB_KNOWN_HOSTS)"
    required: true
  address:
    description: "testlab's LAN address (repository variable TESTLAB_ADDRESS)"
    required: true
runs:
  using: composite
  steps:
    # Downloads first: once the runner is on the tailnet, Homebrew's bottle download failed.
    - shell: bash
      run: brew list docker >/dev/null 2>&1 || brew install docker

    - uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ inputs.tailscale-oauth-client-id }}
        oauth-secret: ${{ inputs.tailscale-oauth-secret }}
        tags: tag:ci

    - shell: bash
      env:
        TESTLAB_SSH_KEY: ${{ inputs.ssh-key }}
        TESTLAB_KNOWN_HOSTS: ${{ inputs.known-hosts }}
        TESTLAB_ADDRESS: ${{ inputs.address }}
      run: |
        [ -n "$TESTLAB_ADDRESS" ] || { echo "::error::Set the repository variable TESTLAB_ADDRESS"; exit 1; }
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "$TESTLAB_SSH_KEY" > ~/.ssh/testlab
        chmod 600 ~/.ssh/testlab
        printf '%s\n' "$TESTLAB_KNOWN_HOSTS" >> ~/.ssh/known_hosts
        cat >> ~/.ssh/config <<CONFIG
        Host testlab
          HostName $TESTLAB_ADDRESS
          User lab
          IdentityFile ~/.ssh/testlab
          IdentitiesOnly yes
          ConnectTimeout 15
          ServerAliveInterval 30
        CONFIG
        # The tailnet route to the address can take a few seconds to arrive.
        for attempt in 1 2 3 4 5 6; do
          ssh testlab true && break
          [ "$attempt" = 6 ] && { echo "::error::testlab ($TESTLAB_ADDRESS) is not reachable over Tailscale"; exit 1; }
          sleep 10
        done
        docker --host ssh://testlab version --format 'testlab Docker {{.Server.Version}}'

    # The lab tool no longer has a built-in testlab: tell it which host to use. xcodebuild hands the
    # test process only variables that start with TEST_RUNNER_, so each one is exported twice: plain
    # for the steps that run the tool themselves (cleanup), prefixed for the tests that start it.
    - shell: bash
      env:
        TESTLAB_ADDRESS: ${{ inputs.address }}
      run: |
        {
          for pair in "SERVERLAB_HOST=testlab" \
                      "SERVERLAB_DOCKER_HOST=ssh://testlab" \
                      "SERVERLAB_ADDRESS=$TESTLAB_ADDRESS" \
                      "SERVERLAB_MEMORY_MB=18432" \
                      "SERVERLAB_DEDICATED=1"; do
            echo "$pair"
            echo "TEST_RUNNER_$pair"
          done
        } >> "$GITHUB_ENV"
