name: "Hatch CI (mirror)"

# Temporary: compiles the mirror of tashda/hatch in .hatch-ci-mirror/hatch (see tools/mirror-to-echo.sh in that repository).
on:
  push:
    branches: [ "claude/echo-labs-features-wmwnbv" ]
    paths: [ ".hatch-ci-mirror/**", ".github/workflows/hatch-ci-mirror.yml" ]
  workflow_dispatch:

concurrency:
  group: hatch-ci-mirror
  cancel-in-progress: true

jobs:
  tests:
    name: "Core tests (macOS)"
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4
    - name: Core tests and CLI smoke test
      working-directory: .hatch-ci-mirror/hatch
      run: |
        git config --global user.email ci@hatch.local && git config --global user.name ci
        set -o pipefail
        swift test 2>&1 | tee /tmp/test.log | grep -E "error:|: failed|Executed [0-9]+ tests" | tail -30
        swift build --product hatch && tools/smoke.sh .build/debug/hatch

  app:
    name: "App (macOS)"
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4
    - name: Versions
      run: swift --version
    - name: Build the app
      working-directory: .hatch-ci-mirror/hatch/App
      run: |
        set -o pipefail
        swift build 2>&1 | tee /tmp/app-build.log | grep -E "error:|Build complete" | sort -u | head -150

  stage:
    name: "Stage and spike timing (macOS)"
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4
    - name: Stage tests
      working-directory: .hatch-ci-mirror/hatch/Stage
      run: |
        set -o pipefail
        swift test 2>&1 | grep -E "error:|: failed|Executed [0-9]+ tests" | tail -10
    - name: Build StageKit and the toast round
      working-directory: .hatch-ci-mirror/hatch/Stage
      run: |
        set -o pipefail
        swift build 2>&1 | tee /tmp/stage-build.log | grep -E "error:|Build complete" | sort -u | head -150
    - name: Spike timing (round only, StageKit cached)
      working-directory: .hatch-ci-mirror/hatch/Stage
      run: |
        touch Sources/Rounds/ToastR18/*.swift
        start=$(date +%s); swift build --product HatchStageToast 2>&1 | tail -3; end=$(date +%s)
        echo "SPIKE round-only build seconds: $((end-start))"
