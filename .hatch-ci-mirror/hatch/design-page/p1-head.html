<title>Hatch Design Decisions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout concept: a drafting-table spec. Left rail of sections with progress, one column of screens, each followed by its decisions. */
:root{
  --bg:#F1F4F7; --surface:#FFFFFF; --surface2:#E8EDF2; --ink:#14213D; --muted:#566376; --line:#D2DAE3;
  --accent:#2B59C3; --accent-ink:#FFFFFF; --accent-soft:#E3EBFB;
  --you:#B4540A; --you-bg:#FBEBDD; --agent:#0B6E80; --agent-bg:#DDF0F3; --app:#4A5B6E; --app-bg:#E4EAF0;
  --done:#2D7A46; --done-bg:#E0F1E6; --off:#76838F; --off-bg:#ECEFF2; --crit:#B3261E; --crit-bg:#FBE4E2;
  --win:#FBFCFD; --side:#EDF1F5; --bar:#E4E9EF; --hatch:#C9D3DF;
  --f-head:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#121B2D; --surface2:#18243A; --ink:#E6ECF7; --muted:#93A1B8; --line:#26354F;
  --accent:#7FA6FF; --accent-ink:#0B1630; --accent-soft:#1A2A4D;
  --you:#F0A25E; --you-bg:#3A2412; --agent:#4FC3D4; --agent-bg:#0F3039; --app:#A3B3C8; --app-bg:#1D2B42;
  --done:#6CCB8A; --done-bg:#12301E; --off:#8697AB; --off-bg:#1B2840; --crit:#FF8A80; --crit-bg:#3C1B19;
  --win:#0E1626; --side:#121D31; --bar:#17233A; --hatch:#243350; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#121B2D; --surface2:#18243A; --ink:#E6ECF7; --muted:#93A1B8; --line:#26354F;
  --accent:#7FA6FF; --accent-ink:#0B1630; --accent-soft:#1A2A4D;
  --you:#F0A25E; --you-bg:#3A2412; --agent:#4FC3D4; --agent-bg:#0F3039; --app:#A3B3C8; --app-bg:#1D2B42;
  --done:#6CCB8A; --done-bg:#12301E; --off:#8697AB; --off-bg:#1B2840; --crit:#FF8A80; --crit-bg:#3C1B19;
  --win:#0E1626; --side:#121D31; --bar:#17233A; --hatch:#243350; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0;padding-inline:16px}
h1,h2,h3,h4{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0 0 .8em}
code,.mono{font-family:var(--f-mono);font-size:.88em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.page{max-width:1240px;margin-inline:auto;padding-block:20px 80px}
.hero{border:1px solid var(--line);border-radius:14px;padding:28px 28px 24px;background:
  repeating-linear-gradient(135deg,transparent 0 9px,var(--hatch) 9px 10px) right/38% 100% no-repeat,var(--surface)}
.hero h1{font-size:clamp(34px,5vw,54px);letter-spacing:-.02em}
.hero .sub{max-width:62ch;color:var(--muted);margin-top:10px;font-size:16px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:22px}
.rule{background:var(--surface2);border-radius:10px;padding:12px 14px;font-size:14px}
.rule b{display:block;font-family:var(--f-head);font-size:15px;margin-bottom:2px}
.howto{margin-top:18px;font-size:14px;color:var(--muted);max-width:80ch}
.howto b{color:var(--ink)}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;margin-top:22px;align-items:start}
.toc{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 10px}
.toc h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 8px 8px}
.toc a{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:13.5px}
.toc a:hover{background:var(--surface2)}
.toc a .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.toc a .n.full{color:var(--done)}
.meter{height:6px;background:var(--surface2);border-radius:4px;margin:6px 8px 10px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.tocbtns{display:grid;gap:6px;margin:10px 4px 2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:default}
section.sec{margin-bottom:56px;scroll-margin-top:12px}
section.sec>h2{font-size:clamp(26px,3.4vw,34px);letter-spacing:-.01em}
.lead{color:var(--muted);max-width:74ch;margin-top:8px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-right:6px;vertical-align:2px}
h3.sub{font-size:19px;margin:26px 0 10px}
.mockbox{border:1px solid var(--line);border-radius:12px;background:var(--surface2);padding:14px;margin:18px 0;overflow-x:auto}
.mockbox>.cap{font-size:12.5px;color:var(--muted);margin:0 2px 10px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.mockbox>.cap b{color:var(--ink)}
.mi{min-width:880px}
.sample{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:5px;padding:0 6px}
table.t{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{background:var(--surface2);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
table.t tr:last-child td{border-bottom:0}
.tscroll{overflow-x:auto}
.tscroll table{min-width:640px}

/* chips & legends */
.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--app-bg);color:var(--app);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.you{background:var(--you-bg);color:var(--you)}.chip.agent{background:var(--agent-bg);color:var(--agent)}
.chip.app{background:var(--app-bg);color:var(--app)}.chip.done{background:var(--done-bg);color:var(--done)}
.chip.off{background:var(--off-bg);color:var(--off)}.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chip.dim{opacity:.28}
.ic{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pathbtns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pathbtns button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px}
.pathbtns button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;overflow-x:auto}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:150px}
.lane h4{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.lane .chip{display:flex;margin-bottom:6px;width:fit-content;transition:opacity .15s}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.type{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.type h4{display:flex;align-items:center;gap:8px;font-size:18px}
.type h4 .ic{width:18px;height:18px}
.type .k{font-size:12.5px;color:var(--muted);margin-top:8px}
.type .k b{color:var(--ink);font-weight:600}

/* decision cards */
.decs{display:grid;gap:18px;margin-top:22px}
.dec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;scroll-margin-top:12px}
.dec.decided{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.dec .top{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:baseline}
.dec .top h4{font-size:18px}
.dec .state{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.dec .state.ok{color:var(--done)}.dec .state.q{color:var(--you)}
.dec .qtext{margin:6px 0 12px;color:var(--muted);max-width:80ch}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.opt{position:relative;display:flex;flex-direction:column;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:10px 11px 11px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--muted)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt .nm{font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.opt .nm .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.opt .ds{font-size:13px;color:var(--muted)}
.opt .star{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 8px}
.wire{width:100%;height:auto;display:block;border-radius:6px;background:var(--surface)}
.wire rect{fill:none;stroke:var(--muted);stroke-width:1}
.wire rect.f{fill:var(--surface2)}.wire rect.a{fill:var(--accent);fill-opacity:.35;stroke:var(--accent)}
.wire text{font:5px var(--f-mono);fill:var(--muted)}
.why{margin-top:12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:8px 12px;font-size:14px}
.why b{font-family:var(--f-head)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.nts{display:grid;gap:8px;margin-top:10px}
.nt{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;background:var(--bg)}
.nt .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:3px}
.nt.question{border-color:color-mix(in srgb,var(--you) 50%,var(--line))}
.nt .reply{margin-top:6px;padding:6px 9px;border-left:3px solid var(--agent);background:var(--agent-bg);border-radius:0 6px 6px 0}
.nt .reply b{color:var(--agent)}
.nt .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline}
.compose{display:grid;gap:6px;margin-top:8px}
.compose textarea{width:100%;min-height:68px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;padding:8px 10px;resize:vertical}
.compose .row{display:flex;gap:8px;align-items:center}
.banner{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13.5px;margin:12px 0;display:none}
.banner.show{display:block}
.banner.warn{border-color:var(--you);background:var(--you-bg)}

.rvi{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface);display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.rvi .tag{margin-top:2px;flex:none}
.rvc{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rvc li{border-left:3px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0;padding:9px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.rvc li b{font-family:var(--f-head)}
/* app mock chrome */
.win{background:var(--win);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-family:var(--f-ui);font-size:12px;color:var(--ink);box-shadow:0 8px 24px rgba(10,20,40,.10)}
.tb{height:30px;background:var(--bar);display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line)}
.tb i{width:10px;height:10px;border-radius:50%;background:#FF5F57}.tb i:nth-child(2){background:#FEBC2E}.tb i:nth-child(3){background:#28C840}
.tb .tt{margin:0 auto;color:var(--muted);font-size:11.5px;transform:translateX(-25px)}
.wb{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:420px}
.sb{background:var(--side);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.sb .proj{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;font-weight:600}
.sb .proj small{margin-left:auto;color:var(--muted);font-weight:400}
.sb .grp{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 8px 3px}
.si{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;color:var(--ink)}
.si.on{background:var(--accent);color:var(--accent-ink)}
.si .b{margin-left:auto;font-size:10.5px;background:var(--you);color:#fff;border-radius:9px;padding:0 6px}
.si.on .b{background:rgba(255,255,255,.3)}
.sb .sync{margin-top:auto;font-size:10.5px;color:var(--muted);padding:6px 8px;display:flex;gap:6px;align-items:center}
.sb .sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--done)}
.ct{display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--win);flex-wrap:wrap}
.bar .sp{flex:1}
.mb{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 9px;font-size:11.5px;display:inline-flex;gap:5px;align-items:center}
.mb.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mb.ok{background:var(--done);color:#fff;border-color:var(--done)}
.mb.bad{background:var(--crit-bg);color:var(--crit);border-color:var(--crit)}
.mb.you{background:var(--you);color:#fff;border-color:var(--you)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:3px 10px;font-size:11.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);flex:1;min-height:0}
.lst{border-right:1px solid var(--line);overflow:hidden}
.gh{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px;display:flex;gap:8px;align-items:center}
.gh .cnt{background:var(--surface2);border-radius:8px;padding:0 6px}
.gh.you{color:var(--you)}.gh.agent{color:var(--agent)}
.rw{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);align-items:center}
.rw.on{background:var(--accent-soft)}
.rw .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .s{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .tyi{width:22px;height:22px;border-radius:6px;background:var(--surface2);display:grid;place-items:center}
.rw .age{font-size:10.5px;color:var(--muted)}
.rw.mut{opacity:.6}
.pane{padding:14px;overflow:hidden}
.pane h5{font-family:var(--f-head);font-size:15px;margin:6px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:9px}
.card.rec{border-color:var(--accent);background:var(--accent-soft)}
.card.turn{background:var(--you-bg);border-color:var(--you)}
.card.turn.agent{background:var(--agent-bg);border-color:var(--agent)}
.card small,.muted{color:var(--muted)}
.mb.pri .kbd{background:transparent;border-color:currentColor;color:inherit}
.kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface);color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 270px;flex:1}
.stack{display:grid;gap:9px}
.fld{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:5px 9px;color:var(--muted);min-height:26px}
.fld.big{min-height:84px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:center;color:var(--muted)}
.thumb{width:62px;height:42px;border-radius:5px;background:linear-gradient(135deg,var(--surface2),var(--line));border:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line)}
.tabs span{padding:7px 10px;color:var(--muted)}
.tabs span.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);font-weight:600}
.steps{display:grid;gap:0}
.stp{display:grid;grid-template-columns:20px 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);align-items:center}
.stp .d{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:9px}
.stp.ok .d{background:var(--done);border-color:var(--done);color:#fff}
.stp.run .d{border-color:var(--agent);box-shadow:0 0 0 3px var(--agent-bg)}
.log{font-family:var(--f-mono);font-size:10.5px;background:var(--bar);border-radius:7px;padding:8px;color:var(--muted);line-height:1.5}
.bar2{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}.bar2 i{display:block;height:100%;background:var(--done)}
.tr{display:grid;gap:0;font-size:11.5px}
.tr>div{display:grid;grid-template-columns:var(--cols);gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);align-items:center}
.tr>div.h{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
.var3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px;flex:1;background:var(--side)}
.vcard{background:var(--win);border:1px solid var(--line);border-radius:9px;padding:10px;position:relative;min-height:230px}
.vcard h6{margin:0 0 8px;font-size:12px}
.wf{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:7px;display:grid;gap:5px}
.wf i{display:block;height:7px;background:var(--surface2);border-radius:3px}.wf i.s{width:60%}.wf i.t{height:10px;background:var(--line);width:45%}
.pin{position:absolute;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--you);color:#fff;display:grid;place-items:center;font-size:9px}
.pin span{transform:rotate(45deg)}

/* the Proposal stage prototype */
.stagewrap{flex:1;display:grid;grid-template-columns:var(--lcol,176px) minmax(0,1fr) var(--rcol,224px);min-height:520px}
#stageMount.mi{min-width:1000px}
.stagewrap.noL{--lcol:0px}.stagewrap.noR{--rcol:0px}
.ctl,.dcn{padding:10px;overflow:hidden;background:var(--win)}
.ctl{border-right:1px solid var(--line)}.dcn{border-left:1px solid var(--line)}
.stagewrap.noL .ctl,.stagewrap.noR .dcn{padding:0;border:0}
.ctl h6,.dcn h6{margin:0 0 6px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stg{--sbg:#E9EEF3;--card:#fff;--st:#142033;--sm:#5B6B7E;--sl:#D6DEE8;--sacc:#2B59C3;--serr:#C0362C;--sok:#2E8B57;
  background:var(--sbg);color:var(--st);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
